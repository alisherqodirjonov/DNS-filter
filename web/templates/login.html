{{define "login"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · DNS Filter</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-page">
  <main class="login">
    <p class="brand">
      <img src="/static/favicon.svg" alt="" width="26" height="26">
      <span>DNS Filter</span>
    </p>
    <section class="login-card">
      <h1>Sign in to the console</h1>
      <p class="lede">Use the account your administrator gave you.</p>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="form-error" hidden></p>
        <button type="submit">Sign in</button>
      </form>
      <noscript><p>This console needs JavaScript. The script is served by this filter.</p></noscript>
    </section>
    <p class="login-foot">Names on a rule or a threat feed are blocked. Everything else is forwarded upstream.</p>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
{{end}}
